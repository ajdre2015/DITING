name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5          # 升级到 v5 (Node 24)

      - name: Setup Go
        uses: actions/setup-go@v6           # 升级到 v6 (Node 24)
        with:
          go-version: '1.25'
          cache-dependency-path: Desktop/go.sum   # 修复缓存路径

      - name: Setup Node.js
        uses: actions/setup-node@v5         # 升级到 v5 (Node 24)
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS (optional)
        run: choco install nsis -y --no-progress

      - name: Clean and install frontend dependencies
        working-directory: Desktop/frontend
        run: |
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install
          npm install @tailwindcss/oxide-win32-x64-msvc --save-dev
        shell: pwsh

      - name: Build Windows
        working-directory: Desktop
        run: .\build.bat
        shell: cmd

      - name: Upload artifacts
        uses: actions/upload-artifact@v5     # 升级到 v5 (Node 24)
        with:
          name: DITING-Windows
          path: Desktop/build/bin/DITING-release-v*.exe
          if-no-files-found: error
