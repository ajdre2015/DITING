name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # 升级到 22

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS (optional)
        run: choco install nsis -y --no-progress

      - name: Clean and install frontend dependencies
        working-directory: Desktop/frontend
        run: |
          # 清理可能不完整的旧依赖，规避 npm 可选依赖 bug
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          
          # 显式安装 Windows 原生绑定，确保 Tailwind CSS 能正常工作
          npm install
          npm install @tailwindcss/oxide-win32-x64-msvc --save-dev
        shell: pwsh

      - name: Build Windows
        working-directory: Desktop
        run: .\build.bat
        shell: cmd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DITING-Windows
          path: Desktop/build/bin/DITING-release-v*.exe
          if-no-files-found: error
